name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Update Capacitor to latest
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npm dedupe
        
      - name: Build web app
        run: npm run build

      - name: Create Capacitor Config
        run: |
          rm -rf android
          rm -f capacitor.config.ts
          echo '{ "appId": "com.queryhenry.aasss", "appName": "Aasss", "webDir": "dist", "bundledWebRuntime": false }' > capacitor.config.json
          cat capacitor.config.json

      - name: Add Android fresh
        run: |
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
